services:

  api:
    build: .
    container_name: rag-api

    command:
      uvicorn app.api:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data


  ui:
    build: .
    container_name: rag-ui

    command:
      streamlit run ui/streamlit_app.py
      --server.address 0.0.0.0
      --server.port 8501

    ports:
      - "8501:8501"

    environment:
      FASTAPI_URL: http://api:8000

    depends_on:
      - api